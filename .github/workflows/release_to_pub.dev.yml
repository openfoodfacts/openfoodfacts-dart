# A CI configuration to auto-publish pub packages.
# https://github.com/dart-lang/ecosystem/tree/main/pkgs/firehose
# https://github.com/dart-lang/ecosystem/wiki/Publishing-automation

name: Publish

on:
  pull_request:
    branches: 
      # release please PR, will only run "validate"
      - release-please--branches--master--components--openfoodfacts
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    # new version triggers validate and publish
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+' ]

permissions:
  pull-requests: write
  id-token: write

jobs:
  publish:
    uses: dart-lang/ecosystem/.github/workflows/publish.yaml@1d2b5ff862c6b93cd86dd06eadac4c9f4d5d6c20 # main
